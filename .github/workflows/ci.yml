name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s selfcheck -p "test_*.py" -v
      - run: python -m compileall -q .
      # Release-only .pt assets are intentionally not committed. This checks
      # committed manifests/records without downloading or writing artifacts.
      - run: python verify_stage4_1_artifacts.py --metadata-only
      # Stage 4.2 is a locked, committed pre-experiment. Verification must be
      # read-only so both supported Python versions catch artifact drift.
      - run: python stage4_2_preexperiment.py --verify
      - run: git diff --exit-code -- artifacts/stage4-2-preexperiment
      # Stage 4.3 engineering-gate reports are also committed, locked input.
      - run: python stage4_3_p3_p4_engineering_gate.py --verify
      - run: git diff --exit-code -- artifacts/stage4-3-p3-p4-engineering-gate
      # Stage 4.4 retains checkpoint binaries locally, while its committed
      # protocol and training records must remain independently reproducible.
      - run: python stage4_4_p3_p4_seed2026.py --verify
      - run: git diff --exit-code -- artifacts/stage4-4-p3-p4-seed2026
